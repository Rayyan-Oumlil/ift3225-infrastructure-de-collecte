# Blueprint Render : backend (API Express) + frontend (client React statique).
# Voir README.md pour la procédure de déploiement pas à pas.
services:
  - type: web
    name: ift3225-api
    runtime: node
    plan: free
    region: oregon
    # --include=dev est nécessaire : `tsc` (typescript) est une devDependency, et un
    # simple `npm install` l'ignorerait si NODE_ENV=production est actif pendant le build.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Cluster MongoDB Atlas de l'équipe — à renseigner dans le tableau de bord Render.
      - key: MONGO_URI
        sync: false
      # Généré automatiquement par Render, jamais commité.
      - key: JWT_SECRET
        generateValue: true
      # URL publique du site statique ci-dessous — à renseigner une fois celui-ci déployé.
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: ift3225-client
    runtime: static
    # Pas de champ `plan` ici : les sites statiques Render sont servis par CDN,
    # sans palier tarifaire (contrairement aux services web classiques).
    # --include=dev par précaution : vite/typescript sont aussi des devDependencies ici.
    buildCommand: cd client && npm install --include=dev && npm run build
    staticPublishPath: client/dist
    envVars:
      # URL publique du service ift3225-api ci-dessus — à renseigner puis redéployer
      # (variable injectée au build par Vite, un simple restart ne suffit pas).
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
